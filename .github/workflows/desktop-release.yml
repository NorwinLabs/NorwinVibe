name: Desktop Build and Release

# Builds the Windows installer and publishes it two ways:
#   1. a normal versioned GitHub Release (v<major>.<minor>.<run number>), for people to download;
#   2. the rolling "desktop-latest" release, which installed copies check for updates (see package.json build.publish).
# The Android app has its own workflow (mobile-release.yml) and never touches this one.
on:
  push:
    branches:
      - main
    paths:
      - 'main.js'
      - 'preload.js'
      - 'src/**'
      - 'native/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'licensing/public.pem'
      - 'store.config.json'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Updates only happen when the version goes UP, so each release gets <major>.<minor>.<run number>.
      # Change major.minor in package.json by hand for bigger releases; the patch number is automatic and never committed.
      - name: Set version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.${{ github.run_number }}"
          npm version "$VERSION" --no-git-tag-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Installed builds ignore testMode anyway (main.js), but fail the release if it is on so nobody ships it by accident.
      - name: Check the store is not in test mode
        run: |
          if node -p "require('./store.config.json').testMode" | grep -q true; then
            echo "::error::store.config.json has testMode true. Set it to false before releasing."
            exit 1
          fi

      - name: Build installer
        run: npm run dist

      - name: Name the installer for the versioned release
        run: cp dist/NorwinVibe-Setup.exe "dist/NorwinVibe-Setup-${{ steps.version.outputs.version }}.exe"

      - name: Create versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NorwinVibe v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: 'true'
          files: |
            dist/NorwinVibe-Setup-${{ steps.version.outputs.version }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The update feed. A fixed tag means installed apps always know where to look, whatever else is released
      # (including the Android APKs). Assets keep constant names, so each build replaces the last.
      - name: Update the rolling update feed
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Desktop update feed (do not delete)
          body: Files that installed copies of NorwinVibe check for updates. Download the installer from the versioned releases instead.
          draft: false
          prerelease: true
          make_latest: 'false'
          overwrite_files: true
          files: |
            dist/NorwinVibe-Setup.exe
            dist/NorwinVibe-Setup.exe.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
