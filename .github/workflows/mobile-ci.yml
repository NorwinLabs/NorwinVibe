name: Mobile CI

# Verification-only workflow for in-progress work on the Android app. It never signs or publishes anything and never
# touches version.properties; that only happens on main via release.yml.
on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'mobile/**'
      - 'src/**'          # the phone app reuses the desktop UI files, so a change there can break the phone build
      - 'licensing/public.pem'
      - 'store.config.json'
      - '.github/workflows/mobile-*.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'licensing/public.pem'
      - 'store.config.json'
      - '.github/workflows/mobile-*.yml'
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Capacitor 7's Android project compiles with Java 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      # Cheap syntax check of the UI code shared with the Windows app, so a typo fails here in seconds.
      - name: Check shared UI scripts parse
        run: |
          for f in ../src/renderer.js ../src/features.js ../src/pro.js ../src/titles.js src/mobile.js; do
            node --check "$f"
          done

      # Fails loudly if the desktop index.html changed shape in a way the phone page generator can't handle.
      - name: Build web assets
        run: npm run build:web

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Compile debug
        working-directory: mobile/android
        run: ./gradlew assembleDebug --stacktrace

      # Release builds use a different build type, so check that it compiles as well. Unsigned here: no secrets in CI.
      - name: Compile release
        working-directory: mobile/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-debug-apk-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-reports-${{ github.sha }}
          path: |
            mobile/android/app/build/reports/**
            mobile/android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
